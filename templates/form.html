{% extends 'base.html' %}

{% block title %}User Form{% endblock %}

{% block content %}
<section class="card">
    <h1>Submit your information</h1>

    {% if error %}
    <div class="alert error">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('submit_form') }}" method="post" class="user-form">
        <div class="field-grid">
            <label>
                Full Name
                <input type="text" name="full_name" required />
            </label>

            <label>
                Email
                <input type="email" name="email" required />
            </label>

            <label>
                Age
                <input type="number" name="age" min="1" required />
            </label>

            <label>
                City
                <input type="text" name="city" required />
            </label>

            <label>
                Country
                <input type="text" name="country" required />
            </label>

            <label>
                Occupation
                <input type="text" name="occupation" required />
            </label>

            <label>
                Hobby
                <input type="text" name="hobby" required />
            </label>

            <label>
                Programming Language
                <input type="text" name="programming_language" required />
            </label>

            <label>
                Online Hours per Day
                <input type="number" name="online_hours" min="0" required />
            </label>

            <label class="wide">
                Entertainment
                <input type="text" name="entertainment" required />
            </label>
        </div>

        <button type="submit" class="button primary">Submit</button>
    </form>
</section>
{% endblock %}
